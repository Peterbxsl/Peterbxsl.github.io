<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="用20个关系情境，梳理你在亲密关系中的核心需求与沟通方式。" />
  <title>你在亲密关系中最需要什么？</title>
  <style>
:root {
  --ink: #2e2531;
  --muted: #7c6f7c;
  --paper: #fffaf6;
  --rose: #ef6d75;
  --rose-dark: #d94f5a;
  --peach: #ffc3a3;
  --lavender: #d9c7f4;
  --mint: #a9d8c3;
  --gold: #e9b96e;
  --line: rgba(62, 43, 58, .11);
  --shadow: 0 24px 70px rgba(100, 57, 72, .16);
}

* { box-sizing: border-box; }
html { min-height: 100%; background: #f8eee9; }
body {
  margin: 0; min-height: 100vh; color: var(--ink);
  font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  background:
    radial-gradient(circle at 15% 8%, rgba(255,255,255,.9), transparent 25%),
    linear-gradient(145deg, #fae8df 0%, #f4eef5 53%, #e8f2ec 100%);
  overflow-x: hidden;
}
button { font: inherit; }
.ambient { position: fixed; border-radius: 50%; filter: blur(8px); opacity: .55; pointer-events: none; }
.ambient-one { width: 320px; height: 320px; right: -110px; top: -90px; background: #ffd3bd; }
.ambient-two { width: 260px; height: 260px; left: -100px; bottom: -80px; background: #cdb9e9; }
.shell { width: min(100% - 32px, 900px); margin: 0 auto; padding: 28px 0 56px; position: relative; z-index: 1; }
.brand { display: flex; align-items: center; gap: 10px; font-size: 14px; font-weight: 700; letter-spacing: .08em; }
.brand-mark { display: grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; color: white; background: var(--ink); font-family: Georgia, serif; }
.screen { display: none; animation: fadeUp .45s ease both; }
.screen.active { display: block; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }

.start-screen { text-align: center; padding-top: clamp(50px, 10vh, 100px); }
.eyebrow, .result-kicker { display: inline-block; padding: 8px 14px; border-radius: 999px; background: rgba(255,255,255,.6); border: 1px solid rgba(255,255,255,.9); color: var(--rose-dark); font-size: 13px; font-weight: 700; letter-spacing: .08em; }
h1 { font-family: Georgia, "Songti SC", serif; font-size: clamp(42px, 8vw, 74px); line-height: 1.05; margin: 24px 0 18px; letter-spacing: -.04em; }
h1 em { font-style: normal; color: var(--rose); }
.lead { max-width: 540px; margin: auto; color: var(--muted); line-height: 1.8; }
.preview-card { position: relative; width: 230px; height: 150px; margin: 44px auto 36px; }
.mini-card { position: absolute; inset: 0; border-radius: 24px; }
.card-back { background: var(--lavender); transform: rotate(-7deg); }
.card-front { display: flex; flex-direction: column; justify-content: center; gap: 8px; background: rgba(255,255,255,.87); border: 1px solid white; box-shadow: var(--shadow); transform: rotate(3deg); }
.card-front span { color: var(--muted); font-size: 12px; }
.card-front strong { font-family: Georgia, "Songti SC", serif; font-size: 24px; }
.sparkles { color: var(--gold); }
.primary-button, .secondary-button { min-height: 52px; border: 0; border-radius: 16px; padding: 0 24px; font-weight: 750; cursor: pointer; transition: .2s ease; }
.primary-button { color: white; background: var(--ink); box-shadow: 0 12px 26px rgba(46,37,49,.2); }
.primary-button:hover:not(:disabled) { transform: translateY(-2px); background: #171118; }
.primary-button:disabled { opacity: .35; cursor: not-allowed; box-shadow: none; }
.primary-button span { margin-left: 18px; }
.secondary-button { color: var(--ink); background: rgba(255,255,255,.55); border: 1px solid rgba(255,255,255,.9); }
.secondary-button:hover:not(:disabled) { background: white; }
.secondary-button:disabled { opacity: .35; cursor: not-allowed; }
.privacy { margin-top: 18px; color: #998c96; font-size: 12px; }

.quiz-screen { padding-top: 34px; }
.quiz-topline { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; color: var(--muted); font-size: 13px; font-weight: 700; }
.icon-button { justify-self: start; width: 38px; height: 38px; border: 1px solid rgba(255,255,255,.9); background: rgba(255,255,255,.5); border-radius: 50%; font-size: 22px; color: var(--muted); cursor: pointer; }
.quiet-badge { justify-self: end; }
.progress-track { height: 5px; background: rgba(255,255,255,.62); border-radius: 9px; margin: 18px 0 28px; overflow: hidden; }
.progress-track div { height: 100%; width: 5%; border-radius: inherit; background: linear-gradient(90deg, var(--rose), var(--gold)); transition: width .35s ease; }
.question-card { min-height: 470px; padding: clamp(26px, 6vw, 56px); border-radius: 32px; background: rgba(255,250,246,.82); border: 1px solid rgba(255,255,255,.9); box-shadow: var(--shadow); backdrop-filter: blur(16px); }
.question-number { color: var(--rose-dark); font-size: 12px; font-weight: 800; letter-spacing: .15em; }
.question-card h2 { max-width: 680px; margin: 16px 0 30px; font-family: Georgia, "Songti SC", serif; font-size: clamp(26px, 4vw, 38px); line-height: 1.4; }
.question-hint { display: none; margin: -18px 0 24px; color: var(--rose-dark); font-size: 13px; font-weight: 700; }
.question-hint.show { display: block; }
.options { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.option { display: flex; align-items: center; gap: 14px; min-height: 68px; padding: 14px 18px; border: 1px solid var(--line); border-radius: 18px; background: rgba(255,255,255,.72); color: var(--ink); text-align: left; cursor: pointer; transition: .2s ease; }
.option:hover { transform: translateY(-2px); border-color: rgba(239,109,117,.45); box-shadow: 0 8px 20px rgba(80,48,62,.08); }
.option.selected { border-color: var(--rose); background: #fff1ec; box-shadow: inset 0 0 0 1px var(--rose); }
.option-key { flex: 0 0 auto; display: grid; place-items: center; width: 32px; height: 32px; border-radius: 10px; background: #f2e9e6; font-family: Georgia, serif; font-weight: 700; }
.option.selected .option-key { color: white; background: var(--rose); }
.navigation { display: flex; justify-content: space-between; gap: 14px; margin-top: 20px; }
.small { min-width: 138px; }

.result-screen { padding-top: 58px; text-align: center; }
.result-screen h1 { margin: 18px 0 10px; color: var(--rose-dark); }
.result-subtitle { max-width: 620px; margin: 0 auto 34px; color: var(--muted); font-size: 17px; line-height: 1.7; }
.ranking-card { max-width: 720px; margin: 0 auto 20px; padding: 26px; text-align: left; background: rgba(255,250,246,.86); border: 1px solid white; border-radius: 28px; box-shadow: 0 15px 40px rgba(95,61,72,.1); }
.rank-row { display: grid; grid-template-columns: 42px minmax(80px,140px) 1fr; align-items: center; gap: 14px; margin: 13px 0; }
.rank-number { display: grid; place-items: center; width: 34px; height: 34px; border-radius: 12px; color: white; background: var(--ink); font-family: Georgia,serif; font-weight: 800; }
.rank-row:first-child .rank-number { background: var(--rose); }
.rank-name strong { display: block; font-size: 15px; }
.rank-name small { color: var(--muted); }
.rank-track { height: 9px; overflow: hidden; border-radius: 99px; background: #eee5e2; }
.rank-track i { display: block; height: 100%; border-radius: inherit; background: linear-gradient(90deg,var(--rose),var(--peach)); }
.report-stack { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; text-align: left; }
.report-stack article { padding: 28px; background: rgba(255,250,246,.84); border: 1px solid white; border-radius: 26px; box-shadow: 0 15px 40px rgba(95,61,72,.08); }
.report-stack article span { display: block; margin-bottom: 14px; color: var(--rose-dark); font-size: 12px; font-weight: 800; letter-spacing: .1em; }
.report-stack p { margin: 0; color: #5f535d; line-height: 1.95; white-space: pre-line; }
.report-stack .wide { grid-column: 1/-1; background: var(--ink); }
.report-stack .wide span { color: var(--peach); }
.report-stack .wide p { color: #fff9f5; }
.result-grid { display: grid; grid-template-columns: 1.05fr .95fr; gap: 18px; text-align: left; }
.chart-card, .insight-card, .advice-grid article { background: rgba(255,250,246,.82); border: 1px solid white; border-radius: 26px; box-shadow: 0 15px 40px rgba(95,61,72,.09); }
.chart-card { display: flex; align-items: center; gap: 28px; padding: 28px; }
.donut { flex: 0 0 auto; display: grid; place-items: center; width: 150px; height: 150px; border-radius: 50%; background: conic-gradient(var(--rose) 0 25%, var(--mint) 25% 50%, var(--gold) 50% 75%, var(--lavender) 75%); position: relative; }
.donut::after { content: ""; position: absolute; inset: 16px; border-radius: 50%; background: var(--paper); }
.donut div { z-index: 1; text-align: center; }
.donut strong { display: block; font-family: Georgia, serif; font-size: 28px; }
.donut span { color: var(--muted); font-size: 11px; }
.score-legend { flex: 1; display: grid; gap: 10px; }
.legend-row { display: grid; grid-template-columns: 12px 1fr auto; align-items: center; gap: 8px; font-size: 13px; }
.legend-dot { width: 9px; height: 9px; border-radius: 50%; }
.legend-row span:nth-child(2) { color: var(--muted); }
.insight-card { padding: 30px; }
.insight-label, .advice-grid article span { display: block; margin-bottom: 14px; color: var(--rose-dark); font-size: 12px; font-weight: 800; letter-spacing: .1em; }
.insight-card p, .advice-grid p { margin: 0; line-height: 1.85; color: #5f535d; }
.advice-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; margin-top: 18px; text-align: left; }
.advice-grid article { padding: 26px; }
.advice-grid .wide { grid-column: 1 / -1; background: var(--ink); }
.advice-grid .wide span { color: var(--peach); }
.advice-grid .wide p { color: #fff9f5; }
.result-actions { display: flex; justify-content: center; gap: 14px; margin-top: 28px; }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); padding: 12px 18px; color: white; background: var(--ink); border-radius: 999px; opacity: 0; pointer-events: none; transition: .3s; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 680px) {
  .shell { width: min(100% - 22px, 900px); padding-top: 18px; }
  .start-screen { padding-top: 45px; }
  .options, .result-grid, .advice-grid, .report-stack { grid-template-columns: 1fr; }
  .question-card { min-height: 0; padding: 26px 18px; border-radius: 25px; }
  .question-card h2 { min-height: 78px; margin-bottom: 22px; }
  .option { min-height: 60px; }
  .chart-card { flex-direction: column; text-align: center; }
  .score-legend { width: 100%; }
  .advice-grid .wide { grid-column: auto; }
  .report-stack .wide { grid-column: auto; }
  .rank-row { grid-template-columns: 38px 105px 1fr; gap: 9px; }
  .result-actions { flex-direction: column-reverse; }
  .result-actions button { width: 100%; }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
}

</style>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>
  <main class="shell">
    <header class="brand" aria-label="亲密关系实验室">
      <span class="brand-mark">♡</span>
      <span>亲密关系实验室</span>
    </header>

    <section id="startScreen" class="screen start-screen active">
      <div class="eyebrow">20 个关系情境 · 约 4 分钟</div>
      <h1>亲密关系中<br><em>你最需要什么？</em></h1>
      <p class="lead">这不是给你贴标签，而是帮你分清：在爱里，什么最能让你安心、靠近，也最容易让你受伤。</p>
      <div class="preview-card" aria-hidden="true">
        <div class="mini-card card-back"></div>
        <div class="mini-card card-front">
          <span>你的关系需求关键词</span>
          <strong>等待揭晓</strong>
          <div class="sparkles">✦　✧　✦</div>
        </div>
      </div>
      <button id="startButton" class="primary-button">开始测试 <span>→</span></button>
      <p class="privacy">答案仅用于本次测试，不会上传或保存</p>
    </section>

    <section id="quizScreen" class="screen quiz-screen">
      <div class="quiz-topline">
        <button id="closeButton" class="icon-button" aria-label="返回开始页">×</button>
        <span id="progressText">01 / 20</span>
        <span class="quiet-badge">凭直觉选</span>
      </div>
      <div class="progress-track" aria-hidden="true"><div id="progressBar"></div></div>
      <article class="question-card">
        <div id="questionNumber" class="question-number">QUESTION 01</div>
        <h2 id="questionText"></h2>
        <p id="questionHint" class="question-hint"></p>
        <div id="options" class="options" role="radiogroup" aria-label="答案选项"></div>
      </article>
      <div class="navigation">
        <button id="prevButton" class="secondary-button">← 上一题</button>
        <button id="nextButton" class="primary-button small" disabled>下一题 →</button>
      </div>
    </section>

    <section id="resultScreen" class="screen result-screen">
      <div class="result-kicker">你的核心关系需求排序</div>
      <h1 id="resultTitle"></h1>
      <p id="resultSubtitle" class="result-subtitle"></p>

      <div id="rankingList" class="ranking-card" aria-label="需求排名"></div>

      <div class="report-stack">
        <article><span>你的整体关系画像</span><p id="resultOverview"></p></article>
        <article><span>第一需求 · 深度解析</span><p id="resultPrimary"></p></article>
        <article><span>第二、第三需求如何影响你</span><p id="resultSecondary"></p></article>
        <article><span>你的需求组合与关系循环</span><p id="resultPattern"></p></article>
        <article><span>需要留意的误区</span><p id="resultBlindSpot"></p></article>
        <article class="wide"><span>给你的具体关系建议</span><p id="resultAdvice"></p></article>
      </div>

      <div class="result-actions">
        <button id="restartButton" class="secondary-button">重新测试</button>
        <button id="shareButton" class="primary-button small">复制结果文案</button>
      </div>
      <div id="toast" class="toast" role="status">结果已复制</div>
    </section>
  </main>
  <script>
const D={
S:{name:"安全感",tag:"确定、可靠、不会突然消失",color:"#ef6d75",meaning:"你需要从稳定回应、清晰承诺和前后一致的行动里确认关系是安全的。模糊、失联和反复比普通分歧更容易消耗你，因为你在意的不只是当下情绪，而是这段关系是否仍然可靠。",love:"你最能通过守约、提前告知、冲突后不失联，以及把你纳入未来安排感受到爱。",risk:"警觉升高时，你可能反复确认、预演最坏结果，或用冷淡测试对方会不会追上来。",ask:"请把联系节奏、临时变化如何告知、冲突后多久恢复沟通说具体；同时保留自己的生活支点，让安心不只依赖对方的即时反应。"},
P:{name:"陪伴",tag:"共享日常、专注在场",color:"#a9d8c3",meaning:"你需要的不只是名义上的关系，而是对方真实参与生活。一起吃饭、散步、处理琐事，或在彼此疲惫时仍愿意留出一段专注时间，会让你确认自己没有被放在生活边缘。",love:"你最能从稳定相处时间、主动靠近和不被手机打断的共同体验中感受到爱。",risk:"当对方忙碌或需要独处时，你可能把时间减少直接理解为感情降温，也可能为了黏合关系牺牲自己的安排。",ask:"与其说“你都不陪我”，不如约定每周一段高质量时间，并区分人在身边、注意力在场和情绪参与这三个层次。"},
U:{name:"理解",tag:"共情、接纳、听懂感受",color:"#e9b96e",meaning:"你需要伴侣先进入你的处境，再讨论对错和办法。对你来说，被理解不是对方凡事赞同，而是你的感受没有被嘲讽、否定或迅速修理，你可以带着不完美的情绪留在关系里。",love:"一句准确的复述、一个耐心的问题，或先安慰再分析，往往比昂贵礼物更能让你感受到爱。",risk:"你可能期待对方自动读懂暗示；一旦理解偏差，就容易把“没听懂”体验成“不在乎”。",ask:"练习说清楚“发生了什么—我有什么感受—此刻想被倾听、拥抱还是一起解决”，也允许伴侣通过提问逐步理解，而不是一次猜中。"},
E:{name:"情绪价值",tag:"积极回应、温暖与被鼓舞",color:"#f3a6b5",meaning:"你很看重关系中的情绪流动：分享快乐时有人一起兴奋，低落时有人主动安慰，普通日子里也有赞美、幽默和热烈回应。你要的不是永远哄你，而是这段关系能让彼此更有能量。",love:"及时回应、真诚夸奖、拥抱、庆祝和带着温度的表达，会让你迅速感到被爱。",risk:"对方表达克制时，你可能误判为冷漠；也可能不断承担活跃气氛的任务，最后觉得只有自己在给关系供能。",ask:"明确告诉对方哪些回应对你有效，并观察情绪劳动是否双向；允许关系有平静期，但不要长期接受敷衍、讽刺和持续性冷淡。"},
V:{name:"被看见",tag:"被重视、被欣赏、被记得",color:"#cfa8e8",meaning:"你希望自己的独特性被伴侣注意：努力被认可、细节被记住、重要时刻被认真对待。你不是单纯追求表扬，而是想确认对方看见了完整的你，而不只是把你当作某个功能或理所当然的存在。",love:"具体的欣赏、主动介绍、记住偏好、肯定付出，以及在人群中仍照顾你的感受，会让你感到自己很重要。",risk:"长期缺少反馈时，你容易通过加倍投入换取认可，或把一次疏忽扩大成“我从来不重要”。",ask:"把“重视我”翻译成可观察的行为，例如重要决定先沟通、对你的付出给出回应；同时把自我价值和伴侣的注意力适度分开。"},
M:{name:"精神共鸣",tag:"深度交流、价值观与内心相遇",color:"#879dd9",meaning:"你期待的不只是生活搭子，还希望思想与内心能彼此进入。价值观、人生选择、兴趣和脆弱经验都可以谈；即使观点不同，对方仍愿意保持好奇，这会让你产生很深的亲密感。",love:"长谈、共同探索、分享作品与新发现，以及对你内心世界持续好奇，是你辨认爱的方式。",risk:"你可能把每次观点差异上升成“不适合”，或低估朴素照顾的价值，让对话变成一场灵魂伴侣考试。",ask:"固定创造深度交流空间，但把共鸣理解为愿意理解而非完全一致；也要观察想法能否落实为责任、照顾和现实协作。"},
A:{name:"尊重与空间",tag:"保有自我、边界与选择权",color:"#75b9b1",meaning:"你需要亲密，但不愿在亲密里失去自己。被信任、拥有独处和社交空间、重大选择被平等商量，会让你更愿意靠近；控制、审问和替你作决定则会迅速削弱爱意。",love:"尊重拒绝、不过度查岗、支持各自兴趣，并在决定前询问你的想法，是你最看重的爱。",risk:"为了避免被束缚，你可能太晚表达需要，或在冲突中迅速抽离，让对方误以为你不在乎。",ask:"提前说明哪些空间是恢复能量、哪些边界不可侵犯，也约定独处之后如何重新连接；自主不是各过各的，而是亲密中的自愿选择。"},
G:{name:"成长支持",tag:"并肩进步、托举目标",color:"#b6bd6e",meaning:"你希望爱能让两个人展开得更好。伴侣理解你的目标、在关键选择上提供资源与鼓励，也愿意共同复盘关系，会让你确认彼此不是互相消耗，而是在成为更完整的人。",love:"认真讨论目标、庆祝进步、困难时提供实际支持，以及敢于给出善意反馈，会让你感受到深层承诺。",risk:"你可能把关系经营成项目，用进步衡量爱，或以“为你好”越过对方节奏，忽略休息与无目的的快乐。",ask:"先询问对方需要鼓励、建议还是实际帮助；把共同成长设为邀请而非考核，也记得肯定已经拥有的生活。"}
};
const questions=[

let current=0,answers=Array.from({length:questions.length},()=>[]);const $=id=>document.getElementById(id);
function showScreen(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");window.scrollTo({top:0,behavior:"smooth"});}
function renderQuestion(){const item=questions[current],chosen=answers[current];$("progressText").textContent=`${String(current+1).padStart(2,"0")} / ${questions.length}`;$("progressBar").style.width=`${(current+1)/questions.length*100}%`;$("questionNumber").textContent=`QUESTION ${String(current+1).padStart(2,"0")}`;$("questionText").textContent=item.q;$("questionHint").textContent=item.multi?`本题可多选，最多选择 ${item.max} 项`:"";$("questionHint").className=`question-hint${item.multi?" show":""}`;$("options").setAttribute("role",item.multi?"group":"radiogroup");$("options").innerHTML="";item.a.forEach((option,index)=>{const selected=chosen.includes(index),b=document.createElement("button");b.className=`option${selected?" selected":""}`;b.setAttribute("role",item.multi?"checkbox":"radio");b.setAttribute("aria-checked",String(selected));b.innerHTML=`<span class="option-key">${selected&&item.multi?"✓":String.fromCharCode(65+index)}</span><span>${option[0]}</span>`;b.onclick=()=>selectOption(index);$("options").appendChild(b);});$("prevButton").disabled=current===0;$("nextButton").disabled=!chosen.length;$("nextButton").textContent=current===questions.length-1?"提交测试 →":"下一题 →";}
function selectOption(index){const item=questions[current];if(item.multi){const pos=answers[current].indexOf(index);if(pos>=0)answers[current].splice(pos,1);else if(answers[current].length<item.max)answers[current].push(index);else{answers[current].shift();answers[current].push(index);}renderQuestion();}else{answers[current]=[index];renderQuestion();if(current<questions.length-1)setTimeout(()=>{current++;renderQuestion();},240);}}
function getScores(){const s=Object.fromEntries(Object.keys(D).map(k=>[k,0]));answers.forEach((picked,i)=>picked.forEach(v=>Object.entries(questions[i].a[v][1]).forEach(([k,n])=>s[k]+=n)));return s;}
function reportText(rank){const[a,b,c]=rank.map(x=>D[x[0]]),close=rank[0][1]-rank[1][1]<=2;return{title:`${a.name} · ${b.name} · ${c.name}`,subtitle:`你的首要需求是「${a.name}」，紧随其后的是「${b.name}」与「${c.name}」。${close?"前两项十分接近，说明它们往往需要同时被满足。":"第一项更突出，是你判断一段关系是否值得投入的关键线索。"}`,overview:`你的答案呈现出一个很清楚的顺序：你会先用“${a.tag}”判断关系是否适合自己，再通过“${b.tag}”确认亲密是否真实，最后由“${c.tag}”决定这段关系能不能长久滋养你。这个排序不是性格判决，也不代表排名靠后的需求不重要；它更像你的关系使用说明书——当核心需求得到稳定回应时，你通常更松弛、更愿意信任，也更能把爱给出去；当它长期落空，即使关系表面没有大问题，你仍可能感到孤独、疲惫或说不出的不对劲。`,primary:`「${a.name}」排在第一位。${a.meaning}${a.love}这也解释了为什么有些在别人看来很小的细节，对你却格外重要：它们触碰的不是一件孤立的小事，而是你用来确认“我在这段关系里是否被好好对待”的核心通道。需要强调的是，这项需求本身没有高低之分；真正重要的是，你能否识别它、准确表达它，并观察对方是否愿意持续回应。`,secondary:`第二位的「${b.name}」意味着：${b.meaning}第三位的「${c.name}」则补充了另一层标准：${c.meaning}所以你真正想要的通常不是单一体验。只有${a.name}却缺少${b.name}，你可能觉得关系“有形式但不贴近”；有${b.name}却长期缺少${c.name}，你又可能觉得当下不错，却难以确信它能走得深、走得久。对你而言，优质关系需要这三种体验彼此配合，而不是用其中一种代替另外两种。`,pattern:`当关系状态良好时，你会因为${a.name}得到满足而放下防备，再主动投入${b.name}，并通过${c.name}建立更深连接。这是一条向上的循环。相反，压力出现时，你可能先在「${a.name}」上感到缺口，随后用「${b.name}」的方式追问或补偿；如果伴侣没有理解真正需求，只回应了表面行为，你就更容易觉得“我已经说了这么多，他还是不懂”。此时最有效的不是把情绪加码，而是指出触发事件、核心需求和希望对方采取的具体行动。`,blindSpot:`你最需要留意的是：${a.risk}同时，${b.risk}${c.risk}这些反应通常不是你“太难相处”，而是保护机制在提醒你某个重要需求没有被照顾。但保护方式如果变成试探、指责、讨好或突然撤退，就可能让伴侣只看见防御，反而看不见你真正的渴望。理解需求的目的，不是要求对方负责你的全部情绪，而是让双方更早、更清楚地协商。`,advice:`第一，把抽象抱怨改成可以执行的请求。关于${a.name}，你可以这样做：${a.ask} 第二，照顾你的第二需求「${b.name}」：${b.ask} 第三，为「${c.name}」留出长期空间：${c.ask}\n\n一次有效沟通可以使用这个句式：“当___发生时，我会感到___，因为对我来说___很重要。我希望下次我们可以___，你觉得什么方式也适合你？”最后，请观察的不是对方能否一次满分，而是他是否愿意听、愿意协商、愿意在行动中逐渐调整。需求可以磨合，长期轻视却不应被浪漫化；适合你的关系，不是永远没有失望，而是失望出现后，你们仍有能力重新理解、修复并靠近。`};}
function renderResult(){const s=getScores(),rank=Object.entries(s).sort((x,y)=>y[1]-x[1]),r=reportText(rank),max=rank[0][1]||1;$("resultTitle").textContent=r.title;$("resultSubtitle").textContent=r.subtitle;$("rankingList").innerHTML=rank.slice(0,5).map(([k,v],i)=>`<div class="rank-row"><span class="rank-number">${i+1}</span><span class="rank-name"><strong>${D[k].name}</strong><small>${D[k].tag.split("、")[0]}</small></span><span class="rank-track"><i style="width:${Math.max(18,v/max*100)}%;background:${D[k].color}"></i></span></div>`).join("");["overview","primary","secondary","pattern","blindSpot","advice"].forEach(k=>$("result"+k.charAt(0).toUpperCase()+k.slice(1)).textContent=r[k]);window.__latestResult={text:`我的核心关系需求排序是：${rank.slice(0,3).map((x,i)=>`${i+1}.${D[x[0]].name}`).join("、")}。${r.subtitle}`};showScreen("resultScreen");}
function reset(){current=0;answers=Array.from({length:questions.length},()=>[]);renderQuestion();showScreen("quizScreen");}
$("startButton").onclick=reset;$("closeButton").onclick=()=>showScreen("startScreen");$("prevButton").onclick=()=>{if(current>0){current--;renderQuestion();}};$("nextButton").onclick=()=>{if(!answers[current].length)return;if(current===questions.length-1)renderResult();else{current++;renderQuestion();}};$("restartButton").onclick=reset;$("shareButton").onclick=async()=>{const text=window.__latestResult.text;try{await navigator.clipboard.writeText(text);}catch{const a=document.createElement("textarea");a.value=text;document.body.appendChild(a);a.select();document.execCommand("copy");a.remove();}$("toast").classList.add("show");setTimeout(()=>$("toast").classList.remove("show"),1800);};
